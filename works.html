  <div id="visualizador">
    <img id="foto-ampliada" alt="">
  </div>
  <script>
    const visualizador = document.getElementById('visualizador');
    const fotoAmpliada = document.getElementById('foto-ampliada');
    const todasAsFotos = document.querySelectorAll('.foto-vertical, .foto-horizontal');

    function abrirFoto(endereco) {
      fotoAmpliada.src = endereco;
      visualizador.classList.add('ativo');
      document.body.style.overflow = 'hidden';
    }

    function fecharFoto() {
      visualizador.classList.remove('ativo');
      document.body.style.overflow = '';
    }

    todasAsFotos.forEach(function (foto) {
      foto.addEventListener('click', function () {
        abrirFoto(foto.src);
      });
    });

    visualizador.addEventListener('click', fecharFoto);

    document.addEventListener('keydown', function (evento) {
      if (evento.key === 'Escape') {
        fecharFoto();
      }
    });
  </script>
